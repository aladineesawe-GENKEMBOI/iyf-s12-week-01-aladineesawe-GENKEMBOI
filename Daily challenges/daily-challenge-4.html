<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f1f5f9;
    }

    h1 {
        text-align: center;
        color: #1e293b;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 1100px;
        margin: 30px auto;
    }

    figure {
        margin: 0;
        background: white;
        padding: 10px;
        border-radius: 8px;
    }

    figure img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    figcaption {
        text-align: center;
        padding: 10px;
        font-weight: bold;
    }

    @media (max-width: 700px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 450px) {
        .gallery {
            grid-template-columns: 1fr;
        }
    }
</style>
