```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1e293b;
        padding: 20px 40px;
    }

    .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 25px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 16px;
    }

    .nav-links a:hover {
        color: #38bdf8;
    }
</style>
```

</head>

<body>

<header>
    <nav aria-label="Main navigation">

        <a href="index.html" class="logo">Aladine Portfolio</a>

            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>
</header>

<main>

</main>
