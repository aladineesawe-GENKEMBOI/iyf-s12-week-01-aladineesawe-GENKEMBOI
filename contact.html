<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

```
<header>
    <h1>Contact Me</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="projects.html">Projects</a>
    </nav>
</header>

<main>
    <h2>Get in Touch</h2>
    <p>Have a question or want to work with me? Send me a message.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname"
                placeholder="Enter your full name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"
                placeholder="Enter your email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"
                placeholder="Enter your phone number"><br><br>

            <label for="subject">Subject:</label><br>
            <select id="subject" name="subject" required>
                <option value="">Select a subject</option>
                <option value="general">General Inquiry</option>
                <option value="collaboration">Collaboration</option>
                <option value="feedback">Feedback</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Your Message</legend>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message"
                placeholder="Write your message (minimum 50 characters)"
                minlength="50" required></textarea><br><br>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to my newsletter</label>
        </fieldset>

        <br>

        <button type="submit">Send Message</button>

    </form>
</main>

<footer>
    <h3>Connect With Me</h3>
    <p>Email: <a href="mailto:your-email@example.com">Send Email</a></p>
    <p>Location: Kenya | Timezone: East Africa Time (EAT)</p>
    <p>&copy; 2026 Aladineesawe-GENKEMBOI</p>
</footer>
```
